[project]
name = "codeology-api"
version = "0.1.0"
description = "Codeology FastAPI application and production adapters"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.136.1",
  "pydantic==2.13.3",
  "pydantic-settings==2.13.1",
  "uvicorn==0.41.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.13.0",
  "pypdf==6.10.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["fixtures*", "tests*"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
