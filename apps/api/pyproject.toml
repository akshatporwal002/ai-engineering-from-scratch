[project]
name = "codeology-api-experiment"
version = "0.1.0"
description = "Isolated in-memory FastAPI migration experiment"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.136.1",
  "pydantic==2.13.3",
  "pydantic-settings==2.13.1",
  "uvicorn==0.41.0",
]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
