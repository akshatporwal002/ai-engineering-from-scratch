name: codeology-quality

on:
  push:
    branches: [main, "codex/**", dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeology-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: tests, audits and static build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the same quality gate used before deployment
        run: npm run ci
      - name: Ensure generated files were not staged accidentally
        run: git diff --exit-code -- . ':!site/data.js' ':!site/build-meta.js' ':!site/certification-data.js'
