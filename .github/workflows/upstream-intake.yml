name: upstream-intake

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Codeology branch that receives the review PR
        required: true
        default: codex/dev
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-intake
  cancel-in-progress: false

jobs:
  prepare-review:
    name: prepare review-only upstream PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_ID: ai-engineering-from-scratch
      UPSTREAM_URL: https://github.com/rohitg00/ai-engineering-from-scratch.git
      TARGET_BRANCH: ${{ inputs.target_branch || 'codex/dev' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch upstream without modifying the checkout
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
      - name: Resolve reviewed range
        id: range
        run: |
          base=$(python -c "import json; d=json.load(open('content-sources.yml')); print(next(s['baselineCommit'] for s in d['sources'] if s['id'] == '$SOURCE_ID'))")
          head=$(git rev-parse upstream/main)
          short=$(git rev-parse --short=12 upstream/main)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          branch="automation/upstream-$short"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$base" = "$head" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report no changes
        if: steps.range.outputs.changed == 'false'
        run: echo "Reviewed upstream baseline is current."
      - name: Generate report and enforce licence gate
        if: steps.range.outputs.changed == 'true'
        run: |
          python scripts/report_upstream_changes.py \
            --source "$SOURCE_ID" \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}" \
            --markdown "$RUNNER_TEMP/upstream-report.md" \
            --json "$RUNNER_TEMP/upstream-report.json" \
            --fail-on-license-change
      - name: Prepare normal merge for review
        if: steps.range.outputs.changed == 'true' && steps.range.outputs.branch_exists == 'false'
        env:
          INTAKE_BRANCH: automation/upstream-${{ steps.range.outputs.short }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$INTAKE_BRANCH"
          git merge --no-ff --no-commit "${{ steps.range.outputs.head }}"
          mkdir -p docs/upstream-reports
          cp "$RUNNER_TEMP/upstream-report.md" "docs/upstream-reports/${{ steps.range.outputs.short }}.md"
          cp "$RUNNER_TEMP/upstream-report.json" "docs/upstream-reports/${{ steps.range.outputs.short }}.json"
          python scripts/advance_source_baseline.py \
            --source "$SOURCE_ID" \
            --new-ref "${{ steps.range.outputs.head }}"
          git add -A
          git commit -m "chore(upstream): review ${{ steps.range.outputs.short }}"
      - name: Push prepared intake branch
        if: steps.range.outputs.changed == 'true' && steps.range.outputs.branch_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTAKE_BRANCH: automation/upstream-${{ steps.range.outputs.short }}
        run: |
          gh auth setup-git
          git push origin "HEAD:$INTAKE_BRANCH"
      - name: Open or update review pull request
        if: steps.range.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTAKE_BRANCH: automation/upstream-${{ steps.range.outputs.short }}
        run: |
          if gh pr view "$INTAKE_BRANCH" --json url >/dev/null 2>&1; then
            gh pr edit "$INTAKE_BRANCH" \
              --title "chore(upstream): review ${{ steps.range.outputs.short }}" \
              --body-file "$RUNNER_TEMP/upstream-report.md"
          else
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$INTAKE_BRANCH" \
              --title "chore(upstream): review ${{ steps.range.outputs.short }}" \
              --body-file "$RUNNER_TEMP/upstream-report.md"
          fi
      - name: Validate new intake without credentials
        if: steps.range.outputs.changed == 'true' && steps.range.outputs.branch_exists == 'false'
        run: npm run ci
